[package]
name = "mapi"
version = "0.1.14"
license = "AGPL-3.0-only"
description = "MAPI - Money, Assets, Planning & Investments"
authors = ["Sebastian Insausti"]
repository = "https://github.com/sinsausti/mapi-desktop"
homepage = "https://github.com/sinsausti/mapi-desktop"
edition = "2021"

[lib]
name = "mapi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
